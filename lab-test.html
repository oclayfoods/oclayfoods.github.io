<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OCLAY Lab Test Report</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    background:#fff;
    max-width:600px;
    width:100%;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:120px;
}

h1{
    text-align:center;
    color:#c62828;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

.product-name{
    text-align:center;
    background:#fff8e1;
    border:1px solid #ffca28;
    color:#c62828;
    padding:14px;
    border-radius:8px;
    font-size:20px;
    font-weight:bold;
    margin-bottom:25px;
}

.report-box{
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    margin-top:15px;
}

.report-box h2{
    font-size:18px;
    margin-bottom:12px;
    color:#333;
}

.report-box p{
    color:#666;
    line-height:1.6;
}

button{
    width:100%;
    padding:15px;
    margin-top:25px;
    background:#c62828;
    color:#fff;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#a61d1d;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="images/logo/logo.png" alt="OCLAY">
    </div>

    <h1>Lab Test Report</h1>

    <p class="subtitle">
        Product quality and laboratory test information
    </p>

    <div class="product-name" id="productName">
        Product
    </div>

    <div class="report-box">
        <h2>Laboratory Test Report</h2>

        <p>
            Lab test report details for this product will be displayed here.
        </p>
    </div>

    <div class="report-box">
        <h2>Quality Information</h2>

        <p>
            OCLAY is committed to maintaining quality and safety standards
            for its products.
        </p>
    </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const product = params.get("product");

const productNames = {
    chilli: "Chilli Powder",
    turmeric: "Turmeric Powder",
    coriander: "Coriander Powder"
};

if(product && productNames[product]){
    document.getElementById("productName").textContent =
        productNames[product];
}
</script>

</body>
</html>
