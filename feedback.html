<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OCLAY Feedback</title>

<link rel="icon" href="images/logo.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:#fff;
max-width:650px;
width:100%;
padding:35px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:120px;
}

h1{
text-align:center;
color:#c62828;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
line-height:1.6;
margin-bottom:30px;
}

.product-name{
text-align:center;
background:#fff7e6;
border:1px solid #ffd54f;
padding:12px;
border-radius:10px;
font-size:20px;
font-weight:bold;
color:#c62828;
margin-bottom:30px;
}

.rating-group{
margin-bottom:28px;
}

.rating-group h3{
margin-bottom:12px;
font-size:18px;
color:#333;
}

.stars{
display:flex;
flex-direction:row-reverse;
justify-content:flex-end;
}

.stars input{
display:none;
}

.stars label{
font-size:34px;
color:#ccc;
cursor:pointer;
transition:.2s;
padding-right:5px;
}

.stars input:checked ~ label{
color:#ffb400;
}

.stars label:hover,
.stars label:hover ~ label{
color:#ffb400;
}

textarea{
width:100%;
height:140px;
padding:15px;
border:1px solid #ccc;
border-radius:10px;
resize:none;
font-size:16px;
margin-top:10px;
}

button{
width:100%;
margin-top:30px;
padding:16px;
border:none;
border-radius:10px;
background:#c62828;
color:#fff;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#9f1d1d;
}

.footer{
text-align:center;
margin-top:25px;
font-size:14px;
color:#777;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<img src="images/logo/logo.png" alt="OCLAY">
</div>

<h1>Customer Feedback</h1>

<p class="subtitle">
We'd love to hear your experience with our product.<br>
Your valuable review helps us improve and serve you better.
</p>

<div class="product-name" id="productName">
Loading Product...
</div>

<form id="feedbackForm">

<div id="ratingContainer"></div>

<label style="font-weight:bold;margin-bottom:8px;display:block;">
Share Your Review
</label>

<textarea
id="feedback"
placeholder="Tell us what you liked and how we can make it even better..."
></textarea>

<button type="submit">
Submit Feedback
</button>

</form>

<div class="footer">
Every review inspires us to serve you better.
Thank you for choosing OCLAY.
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const product = params.get("product") || "Chilli Powder";

document.getElementById("productName").innerText = product;

const ratingFields = {

"Chilli Powder":[
"Aroma",
"Taste",
"Colour",
"Worth for Money"
],

"Turmeric Powder":[
"Aroma",
"Purity",
"Worth for Money"
],

"Coriander Powder":[
"Aroma",
"Taste",
"Worth for Money"
]

};

const container=document.getElementById("ratingContainer");

ratingFields[product].forEach((title,index)=>{

let html=`
<div class="rating-group" data-title="${title}">
<h3>${title}</h3>

<div class="stars">

<input type="radio" id="${index}5" name="rating${index}" value="5">
<label for="${index}5">★</label>

<input type="radio" id="${index}4" name="rating${index}" value="4">
<label for="${index}4">★</label>

<input type="radio" id="${index}3" name="rating${index}" value="3">
<label for="${index}3">★</label>

<input type="radio" id="${index}2" name="rating${index}" value="2">
<label for="${index}2">★</label>

<input type="radio" id="${index}1" name="rating${index}" value="1">
<label for="${index}1">★</label>

</div>

</div>
`;

container.innerHTML+=html;

});

</script>

<script type="module" src="js/feedback.js"></script>

</body>
</html>
