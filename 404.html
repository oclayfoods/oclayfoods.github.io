<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | OCLAY</title>

    <link rel="icon" type="image/png" href="images/logo/favicon.png">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f8f8f8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
            padding:20px;
        }

        .box{
            max-width:600px;
        }

        h1{
            font-size:100px;
            color:#0a7a33;
            margin-bottom:10px;
        }

        h2{
            font-size:32px;
            margin-bottom:20px;
            color:#222;
        }

        p{
            color:#666;
            margin-bottom:30px;
            line-height:1.6;
        }

        a{
            display:inline-block;
            background:#0a7a33;
            color:#fff;
            text-decoration:none;
            padding:14px 28px;
            border-radius:8px;
            font-weight:bold;
        }

        a:hover{
            background:#08642a;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        Sorry, the page you are looking for doesn't exist or has been moved.
    </p>

    <a href="index.html">← Back to Home</a>

</div>

</body>
</html>
